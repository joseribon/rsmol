[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "rsmol"
version = "0.3.0"
description = "Fast, modern molecular visualization with a PyMOL-style scripting API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.scripts]
rsmol = "rsmol.__main__:main"

[project.optional-dependencies]
numpy = ["numpy"]

[tool.maturin]
python-source = "python"
module-name = "rsmol._native"
# Bytecode caches from local test runs do not belong in distributions.
exclude = ["python/rsmol/__pycache__/**"]
