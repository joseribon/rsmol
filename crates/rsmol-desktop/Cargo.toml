[package]
name = "rsmol-desktop"
description = "rsmol desktop app: a WGPUI interface around the native wgpu viewport, on macOS, Linux and Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rsmol-core.workspace = true
rsmol-render.workspace = true
dirs = "6"
env_logger = "0.11"
futures = "0.3"
glam = "0.34"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
# HTTP for `fetch`; rustls, so no system OpenSSL. Gzip bodies are handled by rsmol-core.
ureq = { version = "3", default-features = false, features = ["rustls"] }
wgpu = "30"
wgpui = "0.3.6"

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions as wgpui, so the AppKit bindings are shared rather than duplicated.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }

[target.'cfg(target_os = "linux")'.dependencies]
# libc 0.2.190 dropped `ENOATTR` on Linux, which xattr 0.2.3 (under wgpui's HTTP client) still
# uses. Remove the pin once wgpui moves to a newer xattr.
libc = "=0.2.189"
