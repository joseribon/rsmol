[package]
name = "rsmol-web"
description = "rsmol-render in a browser canvas (WebGPU, or WebGL2), for the app's webview viewport"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm-only, so native workspace builds see an empty crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rsmol-core.workspace = true
rsmol-render.workspace = true
glam = "0.34"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window"] }
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgl", "webgpu"] }
console_error_panic_hook = "0.1"
