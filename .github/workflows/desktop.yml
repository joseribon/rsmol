# Builds and tests the desktop app (crates/rsmol-desktop) on every platform it supports. It is
# one native binary per platform: a WGPUI interface over the wgpu viewport.
name: Desktop app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      # File dialogs (GTK), fonts (fontconfig) and keyboard handling (xkbcommon).
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test -q --workspace
      - name: Build
        run: cargo build -q --release -p rsmol-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: rsmol-desktop-${{ matrix.os }}
          path: |
            target/release/rsmol-desktop
            target/release/rsmol-desktop.exe
