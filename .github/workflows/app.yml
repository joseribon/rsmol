# Builds the desktop app (app/) on every platform it supports. macOS draws natively under a
# transparent webview; Linux and Windows draw in the page through crates/rsmol-web, which the
# platform configs build to WebAssembly before the frontend (`bun run wasm`).
name: App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os != 'macOS' && 'wasm32-unknown-unknown' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      # The CLI must match the wasm-bindgen library version exactly.
      - name: wasm-bindgen CLI
        if: runner.os != 'macOS'
        shell: bash
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Tests
        run: cargo test -q --workspace
      - name: Frontend
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run ${{ runner.os != 'macOS' && 'wasm' || 'build' }}
          bun run check
      - name: Build
        working-directory: app
        run: bun run tauri build --no-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: rsmol-app-${{ matrix.os }}
          path: |
            target/release/rsmol-app
            target/release/rsmol-app.exe
